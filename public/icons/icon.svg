<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Brillos -->
  <circle cx="120" cy="120" r="80" fill="#ffffff" opacity="0.15"/>
  <circle cx="420" cy="80" r="60" fill="#ffffff" opacity="0.1"/>

  <!-- Sol/luna -->
  <circle cx="380" cy="180" r="28" fill="#fde68a" opacity="0.95"/>

  <!-- Montaña posterior (Cotopaxi estilizado) -->
  <path d="M40 380 L160 200 L210 270 L260 220 L360 360 L472 380 L472 472 L40 472 Z" fill="url(#mountain2)"/>

  <!-- Nieve cumbre montaña posterior -->
  <path d="M150 215 L160 200 L175 220 L168 226 L165 222 L160 228 L155 221 Z" fill="#ffffff"/>

  <!-- Montaña principal frontal -->
  <path d="M40 472 L120 360 L200 410 L280 280 L340 360 L420 472 Z" fill="url(#mountain1)"/>

  <!-- Nieve cumbre frontal -->
  <path d="M268 295 L280 280 L298 305 L290 312 L285 305 L280 313 L274 304 Z" fill="#ffffff"/>

  <!-- Pin de ubicación grande -->
  <g transform="translate(256, 200)">
    <path d="M0 -60 C-33 -60 -60 -33 -60 0 C-60 35 -10 95 0 110 C10 95 60 35 60 0 C60 -33 33 -60 0 -60 Z"
          fill="#ffffff"
          stroke="#a855f7"
          stroke-width="6"/>
    <circle cx="0" cy="-5" r="22" fill="#c026d3"/>
  </g>
</svg>
